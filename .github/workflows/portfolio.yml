name: Portfolio CI

on:
  push:
    branches: [main, develop, develop-test]


  pull_request:
    branches: [main, develop, develop-test]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate HTML
        run: npx --yes htmlhint@1.9.2 "**/*.html"

      - name: Validate JavaScript syntax
        run: find . -type f -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -r -n1 node --check